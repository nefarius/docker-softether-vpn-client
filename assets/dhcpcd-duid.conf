# DHCP client for the SoftEther VPN adapter when SE_MAC_ADDRESS is unset.
# duid keeps the client identifier dhcpcd used before a fixed MAC existed,
# so an existing lease is not replaced just by recreating the adapter.
duid

persistent
vendorclassid

option domain_name_servers, domain_name, domain_search
option static_routes, classless_static_routes
option interface_mtu
option host_name

require dhcp_server_identifier
slaac private

nohook resolv.conf
noipv4ll
