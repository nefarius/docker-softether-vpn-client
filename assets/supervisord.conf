[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:vpnclient]
command=/usr/bin/vpnclient execsvc
directory=/usr/vpnclient
autostart=true
autorestart=true
priority=10
startsecs=1
startretries=3
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:dhcpcd]
command=/usr/local/bin/dhcpcd-vpn
autostart=true
autorestart=true
priority=20
startsecs=1
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
