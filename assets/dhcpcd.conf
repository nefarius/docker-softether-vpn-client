# DHCP client for the SoftEther VPN adapter when SE_MAC_ADDRESS is set.
# clientid sends that MAC as the client identifier, so the home DHCP server
# keeps handing out the same lease across container restarts.
# dhcpcd-vpn uses /etc/dhcpcd-vpn-duid.conf when SE_MAC_ADDRESS is unset.
clientid

persistent
vendorclassid

option domain_name_servers, domain_name, domain_search
option static_routes, classless_static_routes
option interface_mtu
option host_name

require dhcp_server_identifier
slaac private

# The VPN DNS servers are applied by dnsmasq when split DNS is enabled.
nohook resolv.conf
noipv4ll
