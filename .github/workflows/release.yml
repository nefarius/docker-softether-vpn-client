name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Require a stable version tag
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish ${GITHUB_REF_NAME}. Use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: containinger
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine mutable alias eligibility
        id: aliases
        run: |
          set -euo pipefail
          newest=false
          newest_major=false
          newest_minor=false
          current="${GITHUB_REF_NAME}"
          major="${current#v}"
          major="${major%%.*}"
          minor_prefix="${current%.*}"
          minor_re="$(printf '%s' "$minor_prefix" | sed 's/\./\\./g')"

          releases="$(
            { git tag -l 'v*'; printf '%s\n' "$current"; } \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -u -V -r
          )"

          newest_tag="$(printf '%s\n' "$releases" | head -n1)"
          newest_major_tag="$(printf '%s\n' "$releases" | grep -E "^v${major}\\." | head -n1 || true)"
          newest_minor_tag="$(printf '%s\n' "$releases" | grep -E "^${minor_re}\\." | head -n1 || true)"

          if [[ "$newest_tag" == "$current" ]]; then newest=true; fi
          if [[ "$newest_major_tag" == "$current" ]]; then newest_major=true; fi
          if [[ "$newest_minor_tag" == "$current" ]]; then newest_minor=true; fi

          {
            echo "newest=$newest"
            echo "newest_major=$newest_major"
            echo "newest_minor=$newest_minor"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: containinger/docker-softether-vpn-client
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.aliases.outputs.newest_minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.aliases.outputs.newest_major == 'true' }}
            type=raw,value=latest,enable=${{ steps.aliases.outputs.newest == 'true' }}

      - name: Reject an existing patch image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="containinger/docker-softether-vpn-client:${version}"
          if output="$(docker buildx imagetools inspect "${image}" 2>&1)"; then
            echo "Refusing to publish ${image}: the patch tag already exists." >&2
            exit 1
          fi
          if [[ "${output}" != *"not found"* ]]; then
            echo "Could not verify whether ${image} already exists." >&2
            printf '%s\n' "${output}" >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
